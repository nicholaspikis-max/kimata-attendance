<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <meta name="theme-color"
        content="#1471b7">

  <title>Kimata Attendance</title>

  <link rel="manifest"
        href="manifest.json">

  <link rel="icon"
        href="kimata-icon.png">

  <link rel="apple-touch-icon"
        href="kimata-icon.png">

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f4f7fa;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      color: #17212b;
    }

    .container {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: 30px 18px 45px;
    }

    .brand {
      text-align: center;
      margin: 20px 0 40px;
    }

    .kimata {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 52px;
      font-weight: 700;
      letter-spacing: 3px;
      color: #1471b7;
    }

    .title {
      margin-top: 5px;
      font-size: 26px;
      font-weight: 700;
    }

    .date {
      margin-top: 8px;
      font-size: 17px;
      color: #6f7b86;
    }

    .groupCard {
      width: 100%;
      min-height: 88px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 24px;
      margin: 14px 0;

      border: none;
      border-radius: 18px;

      background:
        linear-gradient(
          135deg,
          #32a8df,
          #1471b7
        );

      color: white;

      font-size: 26px;
      font-weight: 700;

      box-shadow:
        0 4px 12px rgba(26,111,174,.16);
    }

    .arrow {
      font-size: 40px;
      line-height: 1;
    }

    .message {
      margin-top: 30px;
      text-align: center;
      font-size: 18px;
      color: #6f7b86;
    }

  </style>
</head>

<body>

<div class="container">

  <div class="brand">

    <div class="kimata">
      KIMATA
    </div>

    <div class="title">
      Attendance
    </div>

    <div id="todayDate"
         class="date">
    </div>

  </div>


  <div id="groupButtons"></div>


  <div id="message"
       class="message">
    Loading groups...
  </div>

</div>


<script>

const API_URL =
  "https://script.google.com/macros/s/AKfycbw9Nrd2ol_Abgvf3FYVztBZCQO-Al93XcMiY0VmK95yi2bgHxJ_u16G5yuuvv9FF2pdbg/exec";


function showDate() {

  const today =
    new Date();

  document
    .getElementById("todayDate")
    .innerText =
      today.toLocaleDateString(
        "en-AU",
        {
          weekday: "long",
          day: "numeric",
          month: "long",
          year: "numeric"
        }
      );

}


async function loadGroups() {

  const container =
    document.getElementById(
      "groupButtons"
    );

  const message =
    document.getElementById(
      "message"
    );


  try {

    const response =
      await fetch(
        API_URL + "?api=groups"
      );


    const data =
      await response.json();


    container.innerHTML = "";


    data.groups.forEach(
      function(group) {

        const button =
          document.createElement(
            "button"
          );


        button.className =
          "groupCard";


        button.innerHTML =
          "<span>" +
          group +
          "</span>" +
          "<span class='arrow'>›</span>";


        container.appendChild(
          button
        );

      }
    );


    message.innerText = "";


  } catch (error) {

    message.innerText =
      "Could not connect to attendance system.";

  }

}


showDate();

loadGroups();


if ("serviceWorker" in navigator) {

  window.addEventListener(
    "load",
    function() {

      navigator.serviceWorker.register(
        "service-worker.js"
      );

    }
  );

}

</script>

</body>

</html>
